name: Cross-Server Diff

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 9am UTC
  workflow_dispatch:

permissions: {}

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_diffs: ${{ steps.diff.outputs.has_diffs }}
      diff_hash: ${{ steps.diff.outputs.diff_hash }}

    steps:
      - name: Checkout mcp-starters
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.404'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'

      - name: Clone starter repos
        run: |
          mkdir -p repos
          git clone --depth 1 https://github.com/SamMorrowDrums/mcp-python-starter repos/python
          git clone --depth 1 https://github.com/SamMorrowDrums/mcp-typescript-starter repos/typescript
          git clone --depth 1 https://github.com/SamMorrowDrums/mcp-go-starter repos/go
          git clone --depth 1 https://github.com/SamMorrowDrums/mcp-rust-starter repos/rust
          git clone --depth 1 https://github.com/SamMorrowDrums/mcp-csharp-starter repos/csharp
          git clone --depth 1 https://github.com/SamMorrowDrums/mcp-kotlin-starter repos/kotlin
          git clone --depth 1 https://github.com/SamMorrowDrums/mcp-php-starter repos/php

      - name: Build Python server
        run: |
          cd repos/python
          pip install -e .

      - name: Build TypeScript server
        run: |
          cd repos/typescript
          npm ci
          npm run build

      - name: Build Go server
        run: |
          cd repos/go
          go build -o bin/server ./cmd/stdio

      - name: Build Rust server
        run: |
          cd repos/rust
          cargo build --release

      - name: Build C# server
        run: |
          cd repos/csharp
          dotnet build -c Release

      - name: Build Kotlin server
        run: |
          cd repos/kotlin
          gradle build --no-daemon

      - name: Build PHP server
        run: |
          cd repos/php
          composer install --no-dev

      - name: Create diff config
        run: |
          cat > diff-config.json << 'EOFCONFIG'
          {
            "base": {
              "name": "python",
              "transport": "stdio",
              "start_command": "mcp-python-starter"
            },
            "targets": [
              {
                "name": "typescript",
                "transport": "stdio",
                "start_command": "node repos/typescript/dist/stdio.js"
              },
              {
                "name": "go",
                "transport": "stdio",
                "start_command": "repos/go/bin/server"
              },
              {
                "name": "rust",
                "transport": "stdio",
                "start_command": "repos/rust/target/release/mcp-rust-starter-stdio"
              },
              {
                "name": "csharp",
                "transport": "stdio",
                "start_command": "dotnet run --project repos/csharp --no-build -c Release"
              },
              {
                "name": "kotlin",
                "transport": "stdio",
                "start_command": "gradle -p repos/kotlin runStdio -q --console=plain --no-daemon"
              },
              {
                "name": "php",
                "transport": "stdio",
                "start_command": "php repos/php/bin/server-stdio.php"
              }
            ]
          }
          EOFCONFIG

      - name: Run cross-server diff
        id: diff
        run: |
          set +e
          npx mcp-server-diff@latest -c diff-config.json -o json -q > diff-output.json 2>diff-cli.log
          exit_code=$?
          set -e

          if ! node - "$exit_code" <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const exitCode = Number(process.argv[2]);
          const output = JSON.parse(fs.readFileSync('diff-output.json', 'utf8'));

          if (!Array.isArray(output.results) || output.results.length === 0 || !output.summary) {
            throw new Error('Diff CLI returned an invalid JSON result');
          }

          const hasDiffs = output.results.some((result) => result.hasDifferences);
          const errors = output.results.filter((result) => result.error);
          if (errors.length > 0) {
            throw new Error(`Diff CLI could not probe all servers: ${errors.map((result) => result.target).join(', ')}`);
          }
          if (exitCode !== (hasDiffs ? 1 : 0)) {
            throw new Error(`Diff CLI exit code ${exitCode} did not match its results`);
          }
          if (
            output.summary.total !== output.results.length ||
            output.summary.different !== output.results.filter((result) => result.hasDifferences).length ||
            output.summary.matching !== output.results.filter((result) => !result.hasDifferences).length
          ) {
            throw new Error('Diff CLI summary did not match its results');
          }

          const digest = crypto
            .createHash('sha256')
            .update(JSON.stringify({ results: output.results, summary: output.summary }))
            .digest('hex');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_diffs=${hasDiffs}\ndiff_hash=${digest}\n`,
          );
          NODE
          then
            cat diff-cli.log >&2
            exit 1
          fi

          set +e
          npx mcp-server-diff@latest -c diff-config.json -o markdown -q > diff-report.md 2>diff-report-cli.log
          report_exit_code=$?
          set -e
          if [ "$report_exit_code" -ne "$exit_code" ] || ! grep -q '^## Summary$' diff-report.md; then
            cat diff-report-cli.log >&2
            echo "Diff CLI failed to generate a complete markdown report" >&2
            exit 1
          fi

          cat diff-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload diff report
        uses: actions/upload-artifact@v7
        with:
          name: cross-server-diff-report
          path: |
            diff-output.json
            diff-report.md

  manage-issue:
    needs: diff
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Find existing issue
        id: find_issue
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cross-server-diff',
              per_page: 1
            });
            
            if (issues.data.length > 0) {
              core.setOutput('issue_number', issues.data[0].number);
              const issueBody = issues.data[0].body || '';
              const diffHash = issueBody.match(/^\*Diff hash: ([0-9a-f]{64})\*$/m);
              core.setOutput('issue_diff_hash', diffHash ? diffHash[1] : '');
            } else {
              core.setOutput('issue_number', '');
              core.setOutput('issue_diff_hash', '');
            }

      - name: Download diff report
        if: needs.diff.outputs.has_diffs == 'true'
        uses: actions/download-artifact@v8
        with:
          name: cross-server-diff-report

      - name: Create or update issue
        if: needs.diff.outputs.has_diffs == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('diff-report.md', 'utf8');
            
            const issueBody = `## Cross-Server Interface Differences
            
            This issue is automatically created when MCP starter servers have interface differences compared to the Python reference implementation.

            ${report}
            
            ---
            *Last updated: ${new Date().toISOString()}*
            *Diff hash: ${{ needs.diff.outputs.diff_hash }}*
            `;
            
            const existingIssue = '${{ steps.find_issue.outputs.issue_number }}';
            const existingHash = '${{ steps.find_issue.outputs.issue_diff_hash }}';
            const newHash = '${{ needs.diff.outputs.diff_hash }}';
            
            if (existingIssue && existingHash !== newHash) {
              // Close old issue and create new one (content changed)
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(existingIssue),
                state: 'closed',
                state_reason: 'not_planned'
              });
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔄 Cross-Server Interface Differences Detected',
                body: issueBody,
                labels: ['cross-server-diff']
              });
            } else if (!existingIssue) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔄 Cross-Server Interface Differences Detected',
                body: issueBody,
                labels: ['cross-server-diff']
              });
            }
            // If existingHash === newHash, do nothing (no change)

      - name: Close issue if no diffs
        if: needs.diff.outputs.has_diffs == 'false' && steps.find_issue.outputs.issue_number != ''
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.find_issue.outputs.issue_number }}'),
              state: 'closed',
              state_reason: 'completed'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.find_issue.outputs.issue_number }}'),
              body: '✅ All servers now have matching interfaces! Closing this issue.'
            });
